<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Los Santos Web Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 15px; left: 15px;
            color: white; text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            font-size: 14px; pointer-events: none; line-height: 1.4;
        }
        #speedo {
            position: absolute; top: 15px; right: 15px;
            color: #ffdd57; text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            font-size: 18px; font-weight: bold; pointer-events: none;
        }
        #controls-left {
            position: absolute; bottom: 25px; left: 25px;
            display: flex; gap: 12px;
        }
        #controls-right {
            position: absolute; bottom: 25px; right: 25px;
            display: flex; gap: 12px;
        }
        .btn {
            width: 65px; height: 65px; background: rgba(20, 20, 20, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 16px;
            color: white; font-weight: bold; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); touch-action: manipulation;
        }
        .btn:active { background: rgba(255, 255, 255, 0.45); transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="hud">LOS SANTOS WEB EDITION<br>Steuerung: WASD oder Touch</div>
    <div id="speedo">0 KM/H</div>

    <div id="controls-left">
        <div class="btn" id="left">◀</div>
        <div class="btn" id="right">▶</div>
    </div>
    <div id="controls-right">
        <div class="btn" id="down">S</div>
        <div class="btn" id="up">GAS</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. SZENE & RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.004);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.appendChild(renderer.domElement);

        // 2. SONNENLICHT & SCHATTEN
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3a3a4a, 0.7);
        hemiLight.position.set(0, 120, 0);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff1d0, 1.5);
        sunLight.position.set(100, 160, 80);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 400;
        const d = 140;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 3. PROZEDURALE TEXTUREN
        function createAsphaltTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1f2124';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 18000; i++) {
                const v = Math.floor(Math.random() * 40 + 18);
                ctx.fillStyle = `rgb(${v},${v},${v + 2})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }

            // Gelbe Doppellinie (US/GTA)
            ctx.fillStyle = '#e5a922';
            ctx.fillRect(247, 0, 5, 512);
            ctx.fillRect(260, 0, 5, 512);

            // Weiße Randstreifen
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(28, 0, 6, 512);
            ctx.fillRect(478, 0, 6, 512);

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        function createBuildingTexture(baseColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 256, 512);

            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            for (let y = 0; y < 512; y += 32) ctx.fillRect(0, y, 256, 2);

            const rows = 14, cols = 6;
            const padX = 12, padY = 12;
            const winW = (256 - padX * (cols + 1)) / cols;
            const winH = (512 - padY * (rows + 1)) / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = padX + c * (winW + padX);
                    const y = padY + r * (winH + padY);
                    const lit = Math.random() > 0.74;
                    ctx.fillStyle = lit ? '#ffe8a3' : '#182838';
                    ctx.fillRect(x, y, winW, winH);
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, winW, winH);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        // 4. STADTBAU (Blocks, Gebäude, Palmen)
        const roadTex = createAsphaltTexture();
        const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.35, metalness: 0.1 });
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xa2a2a2, roughness: 0.85 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2c, roughness: 0.9 });

        const buildingColors = ['#cfc7bc', '#8d99ae', '#d8cdc3', '#6c757d', '#b8b0a4'];
        const buildingMats = buildingColors.map(col => new THREE.MeshStandardMaterial({
            map: createBuildingTexture(col), roughness: 0.38, metalness: 0.22
        }));

        const gridSize = 4;
        const blockSize = 38;
        const roadWidth = 16;
        const step = blockSize + roadWidth;
        const totalSize = gridSize * step + roadWidth;

        roadTex.repeat.set(gridSize * 2, gridSize * 2);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(totalSize, totalSize), roadMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4c35, roughness: 0.9 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.7 });

        function addPalmTree(x, z) {
            const palm = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.38, 7.5, 7), trunkMat);
            trunk.position.y = 3.75;
            trunk.castShadow = true;
            palm.add(trunk);

            for (let i = 0; i < 6; i++) {
                const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.1, 3.2, 4), leafMat);
                leaf.position.y = 7.4;
                leaf.rotation.z = Math.PI / 3;
                leaf.rotation.y = (i * Math.PI) / 3;
                leaf.castShadow = true;
                palm.add(leaf);
            }
            palm.position.set(x, 0.4, z);
            scene.add(palm);
        }

        const colliders = [];
        const offset = (gridSize - 1) * step / 2;

        for (let gx = 0; gx < gridSize; gx++) {
            for (let gz = 0; gz < gridSize; gz++) {
                const bx = gx * step - offset;
                const bz = gz * step - offset;

                const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(blockSize, 0.4, blockSize), sidewalkMat);
                sidewalk.position.set(bx, 0.2, bz);
                sidewalk.receiveShadow = true;
                sidewalk.castShadow = true;
                scene.add(sidewalk);

                // Palmen an den Ecken der Gehwege
                const cOff = blockSize / 2 - 1.5;
                addPalmTree(bx - cOff, bz - cOff);
                addPalmTree(bx + cOff, bz + cOff);

                const subOffset = blockSize
